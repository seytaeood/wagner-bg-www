name: WAGNER storefront tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run storefront integrity tests
        run: npm test
